services:
  postgres-rag-test:
    image: pgvector/pgvector:pg17
    container_name: ai-interview-pgvector-test
    restart: "no"
    environment:
      POSTGRES_DB: rag_test_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5434:5432"
    volumes:
      - pgvector_test_data:/var/lib/postgresql/data

volumes:
  pgvector_test_data:
